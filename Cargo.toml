[workspace]
resolver = "2"
members = [
    "crates/agentport-core",
    "crates/agentport-pairing",
    "crates/agentport-relay",
    "crates/agentport-host",
    "crates/agentport-cli",
    "crates/agentport-service",
    "crates/agentport-remote-protocol",
    "crates/agentport-remote-bridge",
    "crates/agentport-mosh-attach",
    "src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "local"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
portable-pty = "0.8"
nix = { version = "0.29", features = ["process", "signal"] }
libc = "0.2"
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
tempfile = "3"
strip-ansi-escapes = "0.2"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
signal-hook = "0.3"
dirs = "5"
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy"] }

# The embedded VT engine is on the PTY ingestion path, including debug Apps.
# Unoptimized QuickJS makes bulk output stall behind its interpreter loop.
[profile.dev.package.rquickjs-sys]
opt-level = 2

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
