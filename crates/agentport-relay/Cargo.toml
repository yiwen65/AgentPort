[package]
name = "agentport-relay"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[features]
default = []
server = ["tokio/signal", "dep:libc"]
connector = ["tokio/process", "tokio/signal", "dep:libc", "dep:keyring"]

[[bin]]
name = "agentport-connector"
path = "src/bin/connector.rs"
required-features = ["connector"]

[[bin]]
name = "agentport-relay"
path = "src/bin/relay.rs"
required-features = ["server"]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Keep the Noise suite unchanged; use ring for accelerated ChaChaPoly.
# ring is already used by the WSS transport. Unsupported primitives retain
# Snow's default resolver (25519 and BLAKE2s).
snow = { version = "=0.10.0", features = ["ring-accelerated"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
url = "2"
zeroize = { version = "1", features = ["derive", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
keyring = { version = "3", features = ["apple-native", "sync-secret-service"], optional = true }

[dev-dependencies]
tempfile = "3"
agentport-remote-protocol = { path = "../agentport-remote-protocol" }
