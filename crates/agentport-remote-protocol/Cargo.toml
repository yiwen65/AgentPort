[package]
name = "agentport-remote-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
zeroize = { version = "1", features = ["serde"] }
base64 = "0.22"

[dev-dependencies]
static_assertions = "1"
