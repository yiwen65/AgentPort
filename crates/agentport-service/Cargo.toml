[package]
name = "agentport-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[dependencies]
agentport-core = { path = "../agentport-core" }
agentport-remote-protocol = { path = "../agentport-remote-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
reqwest = { workspace = true }

[dev-dependencies]
tempfile = "3"
