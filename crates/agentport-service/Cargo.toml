[package]
name = "agentport-service"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version = "1.80"

[dependencies]
agentport-core = { path = "../agentport-core" }
agentport-remote-protocol = { path = "../agentport-remote-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = { workspace = true }
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Descriptor-relative, no-follow reads keep session file access race-safe.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
