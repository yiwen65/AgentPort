name: release

# Tag-driven release: one tag = one version for the Tauri shell, the embedded
# frontend dist and every bundled sidecar. See docs/updater.md.
#
# macOS only: the Tauri updater's Linux payload can only be produced from an
# AppImage bundle, which this project does not publish yet (see
# release-manifest.json). Linux artifacts keep their existing manual flow
# (scripts/build-linux.sh) and are upgraded by the system package manager.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: AgentPort (macOS universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version sync gate (shell = frontend dist = sidecars)
        run: scripts/check-version-sync.sh

      - name: Tag matches the app version
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match app version ${version}" >&2
            echo "run scripts/set-version.sh ${GITHUB_REF_NAME#v} before tagging" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Frontend dependencies
        run: npm --prefix src ci

      # Mirrors the sidecar staging in scripts/build-macos.sh --universal:
      # tauri-build resolves externalBin entries for the exact target triple,
      # so `*-universal-apple-darwin` must exist before the bundler runs.
      - name: Stage universal sidecars
        run: |
          set -euo pipefail
          # src-tauri/binaries is gitignored; a fresh checkout has no directory.
          mkdir -p src-tauri/binaries
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p agentport-host -p agentport-remote-bridge \
              -p agentport-mosh-attach -p agentport-relay \
              --features agentport-relay/connector --target "$target"
          done
          for binary in agentport-host agentport-remote-bridge agentport-mosh-attach agentport-connector; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$binary" \
              "target/x86_64-apple-darwin/release/$binary" \
              -output "src-tauri/binaries/$binary-universal-apple-darwin"
            chmod +x "src-tauri/binaries/$binary-universal-apple-darwin"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing; only the matching public key in tauri.conf.json is
          # accepted by clients, and it is never a substitute for OS signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional Developer ID signing / notarization. Empty values keep the
          # documented ad-hoc local-signing behavior (docs/install.md).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AgentPort ${{ github.ref_name }}"
          releaseBody: "See the assets below. Desktop updates are delivered in-app via the Tauri updater (docs/updater.md)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # `app` is required: the macOS updater payload is the archived .app.
          args: --target universal-apple-darwin --bundles app,dmg
