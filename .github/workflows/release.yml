name: release

# Tag-driven release: one tag = one version for the Tauri shell, the embedded
# frontend dist and every bundled sidecar. See docs/updater.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: AgentPort (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS: tauri-action publishes the same .app.tar.gz under
          # both darwin-aarch64 and darwin-x86_64 in latest.json.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            rust-targets: ""
            tauri-args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Version sync gate (shell = frontend dist = sidecars)
        run: scripts/check-version-sync.sh

      - name: Tag matches the app version
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match app version ${version}" >&2
            echo "run scripts/set-version.sh ${GITHUB_REF_NAME#v} before tagging" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential libssl-dev git

      - name: Frontend dependencies
        run: npm --prefix src ci

      # Mirrors the sidecar staging in scripts/build-macos.sh: externalBin
      # inputs must exist for the exact target being bundled.
      - name: Stage macOS universal sidecars
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p agentport-host -p agentport-remote-bridge \
              -p agentport-mosh-attach -p agentport-relay \
              --features agentport-relay/connector --target "$target"
          done
          for binary in agentport-host agentport-remote-bridge agentport-mosh-attach agentport-connector; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$binary" \
              "target/x86_64-apple-darwin/release/$binary" \
              -output "src-tauri/binaries/$binary-universal-apple-darwin"
            chmod +x "src-tauri/binaries/$binary-universal-apple-darwin"
          done

      - name: Stage Linux sidecars
        if: startsWith(matrix.platform, 'ubuntu')
        run: bash src-tauri/scripts/build-sidecar.sh release

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (verify-only public key lives in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional macOS Developer ID signing / notarization; empty values
          # keep the documented ad-hoc local-signing behavior.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AgentPort ${{ github.ref_name }}"
          releaseBody: "See the assets below. Desktop updates are delivered in-app via the Tauri updater (docs/updater.md)."
          releaseDraft: false
          prerelease: false
          # latest.json is generated and merged across matrix jobs by the action.
          includeUpdaterJson: true
          args: ${{ matrix.tauri-args }}
