[package]
name = "agentport"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
agentport-pairing = { path = "../crates/agentport-pairing" }
agentport-core = { path = "../crates/agentport-core" }
agentport-service = { path = "../crates/agentport-service" }
agentport-remote-protocol = { path = "../crates/agentport-remote-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSBundle",
    "NSError",
    "NSFileManager",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[dev-dependencies]
tempfile = { workspace = true }
