[package]
name = "agentport"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
# v2 updater artifacts only: the v1-compatible `zip` feature is unused, and
# the WebView never gets updater permissions (Rust owns the whole flow).
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "rustls-tls",
    "system-proxy",
] }
agentport-relay = { path = "../crates/agentport-relay", features = ["connector"] }
tokio = { version = "1", features = ["sync", "time", "rt", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
quick-xml = "0.41"
russh = "=0.62.7"
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
zeroize = { version = "1", features = ["serde"] }
thiserror = { workspace = true }
libc = { workspace = true }
agentport-core = { path = "../crates/agentport-core" }
agentport-service = { path = "../crates/agentport-service" }
agentport-remote-protocol = { path = "../crates/agentport-remote-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSBundle",
    "NSError",
    "NSFileManager",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[dev-dependencies]
tempfile = { workspace = true }
agentport-remote-bridge = { path = "../crates/agentport-remote-bridge" }
# Relay E2E tests stand up an in-process relay server next to the connector.
agentport-relay = { path = "../crates/agentport-relay", features = ["server", "connector"] }
