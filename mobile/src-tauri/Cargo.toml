[package]
name = "agentport-mobile"
version = "0.1.0"
description = "Mobile companion for AgentPort"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.85"

[lib]
name = "agentport_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-keyring-store = { version = "=0.2.0", default-features = false }
tauri-plugin-notification = "=2.3.3"
tauri-plugin-clipboard-manager = "=2.3.2"
russh = "=0.62.7"
russh-sftp = "=2.4.0"
agentport-relay = { path = "../../crates/agentport-relay" }
agentport-remote-protocol = { path = "../../crates/agentport-remote-protocol" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
base64 = "0.22"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive", "serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
argon2 = "0.5"
aes-gcm = "0.11"
libc = "0.2"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.4.6"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
agentport-relay = { path = "../../crates/agentport-relay", features = ["server"] }

# The GPL mobile app is an intentional workspace boundary from the MIT root.
[workspace]
