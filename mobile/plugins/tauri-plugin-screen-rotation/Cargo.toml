[package]
name = "tauri-plugin-screen-rotation"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-screen-rotation"
license = "GPL-3.0-only"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
